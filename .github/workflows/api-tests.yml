name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Newman
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra
    
    - name: Create reports directory
      run: mkdir -p reports

    - name: Run API Tests
      run: |
        newman run postman/GoRest_API_tests.postman_collection.json \
          -e postman/GoRest_CI.postman_environment.json \
          --env-var "base_url=${{ vars.BASE_URL || 'https://gorest.co.in/public/v2' }}" \
          --env-var "access_token=${{ secrets.ACCESS_TOKEN }}" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export reports/index.html
    
    - name: Generate timestamp for artifact
      id: timestamp
      if: always()
      run: echo "time=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ steps.timestamp.outputs.time }}
        path: reports/

    - name: Upload GitHub Pages artifact
      if: always() && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: reports/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: api-tests
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4